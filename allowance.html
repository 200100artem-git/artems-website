<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allowance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        #transaction-list::-webkit-scrollbar { width: 6px; }
        #transaction-list::-webkit-scrollbar-track { background: #f1f5f9; }
        #transaction-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .pin-btn { @apply w-16 h-16 rounded-full bg-white text-gray-800 text-2xl font-semibold flex items-center justify-center transition-all shadow-sm hover:shadow-md active:scale-90 border border-gray-100; }
        .pin-digit-box { @apply w-12 h-14 rounded-xl border-2 border-gray-200 bg-white flex items-center justify-center text-3xl font-bold text-gray-800 transition-all; }
        .pin-digit-box.filled { @apply border-indigo-500 ring-4 ring-indigo-50; }
        .account-card { @apply flex items-center justify-between p-4 bg-white border border-gray-100 rounded-2xl shadow-sm hover:border-indigo-500 hover:shadow-md transition-all cursor-pointer; }
        .social-btn { @apply flex items-center justify-center gap-3 w-full py-3 px-4 rounded-xl border border-gray-200 bg-white font-semibold text-gray-700 transition-all hover:bg-gray-50 active:scale-[0.98] relative overflow-hidden; }
        
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(1deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-1deg); }
            100% { transform: rotate(0deg); }
        }
        .shake { animation: shake 0.3s infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-900">

    <!-- Welcome Screen -->
    <div id="welcome-screen" class="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl p-8 space-y-8 hidden">
        <div class="text-center space-y-3">
            <div class="mx-auto w-20 h-20 bg-indigo-600 text-white rounded-3xl flex items-center justify-center shadow-xl mb-4 rotate-3">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-10 h-10"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
            </div>
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">Allowance</h1>
            <p class="text-gray-500 font-medium">Cloud SQL Powered Tracking</p>
        </div>

        <div class="space-y-4">
            <button id="welcome-create-btn" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-lg shadow-lg hover:bg-indigo-700 transition-all transform active:scale-95">Create new user</button>
            <button id="welcome-signin-btn" class="w-full py-4 bg-gray-50 text-gray-700 rounded-2xl font-bold text-lg hover:bg-gray-100 transition-all transform active:scale-95">Sign in existing user</button>
            
            <div class="relative py-2">
                <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-gray-100"></span></div>
                <div class="relative flex justify-center text-xs uppercase font-bold text-gray-400"><span class="bg-white px-2">Quick Access</span></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button class="social-btn" data-provider="Google">Google</button>
                <button class="social-btn" data-provider="Microsoft">Microsoft</button>
                <button class="social-btn" data-provider="Amazon">Amazon</button>
                <button class="social-btn" data-provider="Facebook">Facebook</button>
            </div>
        </div>

        <div class="text-center pt-4 border-t border-gray-100">
            <a href="index.html" class="text-sm text-gray-400 hover:text-indigo-600 font-medium transition-colors underline decoration-dotted underline-offset-4">Back home</a>
        </div>
    </div>

    <!-- Name Entry Modal -->
    <div id="name-modal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-[60] hidden">
        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm p-8 space-y-6">
            <div class="text-center space-y-2">
                <h4 class="text-2xl font-black text-gray-900 uppercase">Profile Name</h4>
                <p id="name-modal-desc" class="text-sm text-gray-500 font-medium">What should we call you?</p>
            </div>
            <input type="text" id="profile-name-input" placeholder="e.g., Alice, Mom, Dad" class="w-full p-4 rounded-xl border-2 border-gray-100 focus:border-indigo-500 outline-none transition-all font-bold text-center text-xl">
            <div class="flex gap-3">
                <button id="cancel-name-entry" class="flex-1 py-4 bg-gray-50 text-gray-500 font-bold rounded-xl hover:bg-gray-100 transition-all">Cancel</button>
                <button id="confirm-name-entry" class="flex-[2] py-4 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all">Next</button>
            </div>
        </div>
    </div>

    <!-- Account Selection Screen -->
    <div id="account-selection-screen" class="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl p-8 space-y-6 hidden">
        <header class="flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button id="back-to-welcome" class="p-2 text-gray-400 hover:text-indigo-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
                </button>
                <h2 class="text-2xl font-bold text-gray-900">Profiles</h2>
            </div>
            <div class="flex gap-1">
                <button id="refresh-accounts-btn" class="p-2 text-indigo-400 hover:text-indigo-600 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
                </button>
                <button id="edit-mode-btn" class="p-2 text-gray-400 hover:text-indigo-600 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M10.34 15.84c-.688-.06-1.386-.09-2.09-.09H7.5a4.5 4.5 0 1 1 0-9h.75c.704 0 1.402-.03 2.09-.09m0 9.18c.253.062.51.114.769.155a4.501 4.501 0 0 0 4.558-4.513 4.5 4.5 0 0 0-4.558-4.512 3.53 3.53 0 0 0-.769.155m0 9.18c-.246.062-.494.114-.744.155a45.97 45.97 0 0 0-7.333 0c-.25.041-.498.093-.744.155m11.334-9.18c.247.062.494.114.744.155a45.97 45.97 0 0 1 7.333 0c.25.041.498.093.744.155m-11.334 0c-.253-.062-.51-.114-.769-.155" /></svg>
                </button>
            </div>
        </header>
        <div id="account-list" class="space-y-3 min-h-[100px] flex flex-col justify-center">
            <p class="text-center text-gray-400 italic">Syncing with CockroachDB...</p>
        </div>
        <div class="text-center pt-4">
            <a href="index.html" class="text-sm text-gray-400 hover:text-indigo-600 font-medium transition-colors underline decoration-dotted underline-offset-4">Back home</a>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="main-app-container" class="w-full max-w-lg bg-white rounded-[2.5rem] shadow-2xl p-6 md:p-10 space-y-8 relative hidden">
        <header class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold text-indigo-600">Allowance</h1>
                <p id="active-username" class="text-gray-500 font-bold mt-1">@SQL_USER</p>
            </div>
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-xs font-bold text-gray-400 hover:text-indigo-600">HOME</a>
                <button id="logout-btn" class="px-5 py-2 bg-red-50 text-red-600 font-bold rounded-xl hover:bg-red-100 transition-all">EXIT</button>
            </div>
        </header>

        <div id="balance-container" class="bg-indigo-600 text-white rounded-[2rem] p-10 text-center shadow-2xl transition-all">
            <h2 class="text-xs uppercase font-black tracking-widest text-indigo-200 mb-2">Balance</h2>
            <div id="balance" class="text-6xl font-black tabular-nums">$0.00</div>
            <p id="sync-status" class="text-xs mt-3 text-indigo-200 font-bold">Cloud Sync Active</p>
        </div>

        <form id="transaction-form" class="space-y-5 bg-gray-50 p-6 rounded-[2rem]">
            <input type="text" id="description" placeholder="Description" class="w-full p-4 rounded-xl border border-gray-200 focus:ring-4 focus:ring-indigo-100 outline-none transition-all font-medium" required>
            <input type="number" id="amount" step="0.01" placeholder="0.00" class="w-full p-4 rounded-xl border border-gray-200 focus:ring-4 focus:ring-indigo-100 outline-none transition-all font-bold text-xl" required>
            <div class="grid grid-cols-2 gap-4 pt-2">
                <button type="submit" id="add-btn" class="py-4 bg-green-500 text-white font-black rounded-2xl shadow-lg hover:bg-green-600 active:scale-95 transition-all">ADD</button>
                <button type="submit" id="subtract-btn" class="py-4 bg-red-500 text-white font-black rounded-2xl shadow-lg hover:bg-red-600 active:scale-95 transition-all">SPEND</button>
            </div>
        </form>

        <div id="transaction-list" class="space-y-3 h-64 overflow-y-auto px-2"></div>
    </div>

    <!-- PIN Screen -->
    <div id="pin-screen" class="w-full max-w-sm bg-white rounded-[2.5rem] shadow-2xl p-8 text-center space-y-8 hidden">
        <h2 id="pin-screen-title" class="text-2xl font-black text-gray-800 uppercase tracking-tight tracking-widest">Security Check</h2>
        <div id="pin-boxes" class="flex justify-center space-x-3">
            <div class="pin-digit-box"></div><div class="pin-digit-box"></div><div class="pin-digit-box"></div><div class="pin-digit-box"></div>
        </div>
        <p id="pin-error" class="text-sm font-bold text-red-500 h-4 uppercase tracking-tighter"></p>
        <div id="pin-keypad" class="grid grid-cols-3 gap-4 justify-items-center">
            <button class="pin-btn" data-key="1">1</button><button class="pin-btn" data-key="2">2</button><button class="pin-btn" data-key="3">3</button>
            <button class="pin-btn" data-key="4">4</button><button class="pin-btn" data-key="5">5</button><button class="pin-btn" data-key="6">6</button>
            <button class="pin-btn" data-key="7">7</button><button class="pin-btn" data-key="8">8</button><button class="pin-btn" data-key="9">9</button>
            <div class="w-16 h-16"></div><button class="pin-btn" data-key="0">0</button>
            <button class="pin-btn bg-gray-50" data-key="delete">⌫</button>
        </div>
    </div>

    <script type="module">
        const API_URL = "https://allowance-api-q6zr.onrender.com";

        document.addEventListener('DOMContentLoaded', () => {
            const welcomeScreen = document.getElementById('welcome-screen');
            const mainAppContainer = document.getElementById('main-app-container');
            const pinScreen = document.getElementById('pin-screen');
            const accountSelectionScreen = document.getElementById('account-selection-screen');
            const nameModal = document.getElementById('name-modal');
            const nameInput = document.getElementById('profile-name-input');
            const nameModalDesc = document.getElementById('name-modal-desc');
            const accountListEl = document.getElementById('account-list');
            const balanceEl = document.getElementById('balance');
            const transactionListEl = document.getElementById('transaction-list');
            const form = document.getElementById('transaction-form');
            const descriptionInput = document.getElementById('description');
            const amountInput = document.getElementById('amount');

            let activeAccountId, activeAccountName, storedPin, pinEntry = [], pinMode = 'enter', editMode = false;

            // --- API HELPERS ---
            async function getAccounts() {
                accountListEl.innerHTML = '<p class="text-center text-gray-400 italic py-4">Syncing...</p>';
                try {
                    const res = await fetch(`${API_URL}/accounts`);
                    if (!res.ok) throw new Error("API Offline");
                    const accounts = await res.json();
                    renderAccountList(accounts);
                } catch (e) { 
                    accountListEl.innerHTML = `
                        <div class="text-center space-y-2 py-4">
                            <p class="text-red-500 text-sm font-bold uppercase">Sync Failed</p>
                            <button id="retry-btn" class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-bold">RETRY CONNECTION</button>
                        </div>`;
                    document.getElementById('retry-btn').onclick = getAccounts;
                }
            }

            async function postAccount(name, pin) {
                try {
                    const res = await fetch(`${API_URL}/accounts`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ name, pin })
                    });
                    if(res.ok) {
                        document.getElementById('pin-error').textContent = 'Profile Created!';
                        document.getElementById('pin-error').classList.replace('text-red-500', 'text-green-500');
                        setTimeout(() => {
                            document.getElementById('pin-error').classList.replace('text-green-500', 'text-red-500');
                            showWelcome();
                            getAccounts();
                        }, 1200);
                    }
                } catch (e) { console.error(e); }
            }

            async function deleteAccount(id) {
                if(!confirm("Permanently delete this profile?")) return;
                try {
                    await fetch(`${API_URL}/accounts/${id}`, { method: 'DELETE' });
                    getAccounts();
                } catch (e) { console.error(e); }
            }

            async function getTransactions(accId) {
                try {
                    const res = await fetch(`${API_URL}/transactions?accountId=${accId}`);
                    const txs = await res.json();
                    renderTransactions(txs);
                } catch (e) { console.error(e); }
            }

            async function postTransaction(desc, amt) {
                try {
                    await fetch(`${API_URL}/transactions`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ accountId: activeAccountId, description: desc, amount: amt })
                    });
                    getTransactions(activeAccountId);
                } catch (e) { console.error(e); }
            }

            // --- UI RENDERERS ---
            function renderAccountList(accounts) {
                accountListEl.innerHTML = '';
                if (accounts.length === 0) {
                    accountListEl.innerHTML = '<p class="text-center text-gray-400 py-4 italic">No profiles created yet.</p>';
                    return;
                }
                accounts.forEach(acc => {
                    const div = document.createElement('div');
                    div.className = `account-card ${editMode ? 'shake' : ''}`;
                    div.innerHTML = `
                        <span class="font-bold text-gray-800 text-lg">${acc.name}</span>
                        ${editMode ? `
                            <button class="p-2 text-red-500 hover:bg-red-100 rounded-xl" onclick="event.stopPropagation(); window.deleteAccountTrigger('${acc.id}')">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg>
                            </button>
                        ` : `<span class="text-xs font-black text-indigo-600">ENTER</span>`}
                    `;
                    div.onclick = () => {
                        if (editMode) return;
                        activeAccountId = acc.id; activeAccountName = acc.name; storedPin = acc.pin; setupPin('enter');
                    };
                    accountListEl.appendChild(div);
                });
            }

            window.deleteAccountTrigger = deleteAccount;

            function renderTransactions(txs) {
                transactionListEl.innerHTML = '';
                let total = 0;
                txs.forEach(tx => {
                    total += parseFloat(tx.amount);
                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center p-4 bg-gray-50 rounded-2xl border border-gray-100';
                    item.innerHTML = `<div><p class="font-bold text-gray-800">${tx.description}</p></div><p class="font-black ${tx.amount >= 0 ? 'text-green-600' : 'text-red-500'}">${tx.amount >= 0 ? '+' : ''}${parseFloat(tx.amount).toFixed(2)}</p>`;
                    transactionListEl.appendChild(item);
                });
                balanceEl.textContent = `$${total.toFixed(2)}`;
                document.getElementById('balance-container').className = total < 0 ? 'bg-red-500 text-white rounded-[2rem] p-10 text-center shadow-2xl transition-all' : 'bg-indigo-600 text-white rounded-[2rem] p-10 text-center shadow-2xl transition-all';
            }

            // --- NAVIGATION ---
            function hideAll() { [welcomeScreen, pinScreen, accountSelectionScreen, mainAppContainer, nameModal].forEach(s => s.classList.add('hidden')); }
            function showWelcome() { hideAll(); welcomeScreen.classList.remove('hidden'); }
            function showAccountSelection() { hideAll(); editMode = false; accountSelectionScreen.classList.remove('hidden'); getAccounts(); }
            
            function setupPin(mode) { 
                hideAll(); pinMode = mode; pinEntry = []; updatePinUI(); 
                pinScreen.classList.remove('hidden'); 
                const title = document.getElementById('pin-screen-title');
                title.textContent = mode === 'set' ? `New PIN: ${activeAccountName}` : (mode === 'confirm' ? 'Confirm PIN' : `Verify: ${activeAccountName}`);
            }

            function updatePinUI() {
                const boxes = document.getElementById('pin-boxes').children;
                for (let i = 0; i < boxes.length; i++) {
                    boxes[i].innerHTML = pinEntry[i] ? '<div class="w-3 h-3 bg-indigo-600 rounded-full"></div>' : '';
                    i < pinEntry.length ? boxes[i].classList.add('filled') : boxes[i].classList.remove('filled');
                }
            }

            function handlePin(key) {
                if(key === 'delete') pinEntry.pop(); 
                else if(pinEntry.length < 4) pinEntry.push(key);
                updatePinUI();
                
                if(pinEntry.length === 4) {
                    const entered = pinEntry.join('');
                    setTimeout(() => {
                        if(pinMode === 'set') { storedPin = entered; setupPin('confirm'); }
                        else if(pinMode === 'confirm') {
                            if (entered === storedPin) postAccount(activeAccountName, storedPin);
                            else { 
                                document.getElementById('pin-error').textContent = 'PINs did not match'; 
                                setTimeout(() => setupPin('set'), 1000); 
                            }
                        }
                        else if(pinMode === 'enter') {
                            if (entered === storedPin) {
                                hideAll(); mainAppContainer.classList.remove('hidden'); 
                                document.getElementById('active-username').textContent = "@" + activeAccountName.toUpperCase();
                                getTransactions(activeAccountId); 
                            } else {
                                pinEntry = []; updatePinUI(); 
                                document.getElementById('pin-error').textContent = 'Invalid PIN';
                                setTimeout(() => document.getElementById('pin-error').textContent = '', 2000);
                            }
                        }
                    }, 250);
                }
            }

            // --- KEYBOARD SUPPORT ---
            window.addEventListener('keydown', (e) => {
                if (!pinScreen.classList.contains('hidden')) {
                    if (e.key >= '0' && e.key <= '9') handlePin(e.key);
                    if (e.key === 'Backspace') handlePin('delete');
                }
            });

            // --- EVENTS ---
            document.querySelectorAll('.social-btn').forEach(btn => {
                btn.onclick = () => {
                    const prov = btn.dataset.provider;
                    nameInput.value = '';
                    nameModalDesc.textContent = `Link your ${prov} account to a profile.`;
                    nameModal.classList.remove('hidden');
                    nameInput.focus();
                };
            });

            document.getElementById('welcome-create-btn').onclick = () => {
                nameInput.value = '';
                nameModalDesc.textContent = "What should we call you?";
                nameModal.classList.remove('hidden');
                nameInput.focus();
            };

            document.getElementById('confirm-name-entry').onclick = () => {
                const name = nameInput.value.trim();
                if(name) { activeAccountName = name; setupPin('set'); }
            };
            
            document.getElementById('cancel-name-entry').onclick = () => nameModal.classList.add('hidden');
            document.getElementById('welcome-signin-btn').onclick = showAccountSelection;
            document.getElementById('back-to-welcome').onclick = showWelcome;
            document.getElementById('logout-btn').onclick = showWelcome;
            document.getElementById('refresh-accounts-btn').onclick = getAccounts;
            document.getElementById('edit-mode-btn').onclick = () => { editMode = !editMode; getAccounts(); };

            document.getElementById('pin-keypad').onclick = (e) => {
                const btn = e.target.closest('button');
                if(btn) handlePin(btn.dataset.key);
            };

            form.onsubmit = async (e) => {
                e.preventDefault();
                const desc = descriptionInput.value.trim();
                let amt = parseFloat(amountInput.value);
                if (!desc || isNaN(amt)) return;
                amt = (e.submitter.id === 'subtract-btn') ? -Math.abs(amt) : Math.abs(amt);
                await postTransaction(desc, amt);
                form.reset();
            };

            showWelcome();
        });
    </script>
</body>
</html>
